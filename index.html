<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ofir Elboym · Content Creator</title>
  <meta name="description" content="Short and long-form social content: Reels, TikTok, YouTube.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="preload" as="image" href="/bg.jpg">
</head>
<body>
  <main class="app" id="app">
    <section class="stage boot" id="stage" aria-label="Selected work">
      <div class="world" aria-hidden="true">
        <img class="layer sky" src="/bg.jpg" alt="" width="2500" height="848" fetchpriority="high">
        <img class="layer ground" src="/bg.jpg" alt="" width="2500" height="848">
      </div>
      <canvas id="dust" aria-hidden="true"></canvas>
      <div class="spot">
        <div class="word" id="word" aria-hidden="true"></div>
        <div class="pshadow" id="pshadow" aria-hidden="true"></div>
        <div class="tilt" id="tilt">
          <div class="float" id="float">
            <div class="phone" id="phone"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i></div>
            <div class="bezel" id="bezel"><div class="island"></div><div class="glare"></div></div>
          </div>
        </div>
      </div>
      <div class="shade" aria-hidden="true"></div>
      <section class="about-area" id="about-area" aria-label="About" inert>
        <h1>ofir elboym</h1>
        <p>singer-songwriter</p>
        <ul>
          <li><a href="https://www.youtube.com/@ofirelboym" target="_blank" rel="noopener">youtube</a></li>
          <li><a href="https://ofirmusic.com" target="_blank" rel="noopener">music</a></li>
        </ul>
      </section>
    </section>

    <header class="masthead">
      <a class="name" href="#work">ofir elboym</a>
      <span class="tag">short &amp; long-form content</span>
      <nav class="links">
        <a class="to-about" href="#about">about</a>
        <a class="to-about" href="#about">contact</a>
        <a class="to-work" href="#work">work</a>
        <button id="sound" type="button" aria-pressed="false">sound off</button>
      </nav>
    </header>

    <footer class="bottom">
      <p class="caption" id="caption" aria-live="polite"></p>
      <ol class="nums" id="nums" aria-label="Choose a video"></ol>
    </footer>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
